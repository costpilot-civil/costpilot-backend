[project]
name = "costpilot-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "costpilot-core",
    "fastapi>=0.147.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
costpilot-core = { path = "../costpilot-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
